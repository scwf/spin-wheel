<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L4产品云服务轮盘转</title>
    <style>
        /* --- 全局样式 --- */
        :root {
            --wheel-size: 400px;
            --item-count: 8; /* 默认选项数量，会由JS动态更新 */
            --item-angle: calc(360deg / var(--item-count));
            --turn-duration: 6s; /* 轮盘转动时间 */
            --primary-color: #ff6b6b;
            --secondary-color: #f0f0f0;
            --text-color: #333;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 改为 flex-start */
            /* height: 100vh; */ /* 移除固定高度 */
            margin: 0;
            background-color: var(--bg-color);
            overflow: auto; /* 改为 auto */
            padding: 5vh 0; /* 增加垂直内边距 */
        }

        .main-container {
            display: flex;
            align-items: center;
            gap: 50px;
        }

        /* --- 抽奖容器 --- */
        .wheel-container {
            position: relative;
            width: var(--wheel-size);
            height: var(--wheel-size);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 轮盘核心 --- */
        .wheel {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transform-origin: center;
            transform: rotate(0deg);
            will-change: transform;
            background: conic-gradient(#fff 0deg, #fff 360deg); /* Placeholder */
        }

        .labels {
            position: absolute;
            inset: 0;
        }

        .label {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: 0% 0%;
            color: var(--text-color);
            font-weight: bold;
            font-size: 16px;
        }

        .label > span {
            display: inline-block;
            transform: rotate(-90deg);
            padding: 5px 15px;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- 指针 --- */
        .pointer {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid var(--primary-color);
            top: 20px;
            left: calc(50% - 15px);
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        /* --- 中央按钮 --- */
        .spin-button {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: white;
            border: 5px solid var(--secondary-color);
            color: var(--primary-color);
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .spin-button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .spin-button:active {
            transform: scale(1.05);
        }

        .spin-button[disabled] {
            cursor: not-allowed;
            color: #aaa;
            transform: scale(1);
            background-color: #f8f8f8;
        }

        /* --- Panel --- */
        .panel {
            width: 300px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .panel h2 {
            text-align: center;
            color: var(--text-color);
            margin: 0 0 15px 0;
        }

        .options-container {
            /* max-height: 350px; */
            /* overflow-y: auto; */
        }

        .options-container h3 {
            color: var(--primary-color);
            margin: 15px 0 8px;
        }

        .options-container ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .options-container li {
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .main-container {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="wheel-container">
            <div class="wheel" id="wheel">
                <div class="labels" id="labels"></div>
            </div>
            <div class="pointer"></div>
            <div class="spin-button" id="spin-btn">开始</div>
        </div>

        <aside class="panel">
            <h2>云服务列表（L4）</h2>
            <div id="options-list" class="options-container"></div>
        </aside>
    </div>

    <script>
    // ===================== 配置 =====================
    const OPTIONS = [
      { name: 'A类', options: ['A1', 'A2', 'A3', 'A4', 'A5', 'A6', 'A7', 'A8', 'A9'] },
      { name: 'B类', options: ['B1', 'B2'] },
      { name: 'C类', options: ['C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'C7', 'C8', 'C9', 'C10', 'C11', 'C12', 'C13', 'C14', 'C15', 'C16', 'C17', 'C18', 'C19'] },
    ];
    const MIN_SPINS = 5;
    const MAX_SPINS = 8;
    const MIN_DURATION = 3800;
    const MAX_DURATION = 6200;

    // ===================== 初始化 =====================
    const wheel = document.getElementById('wheel');
    const labels = document.getElementById('labels');
    const btn = document.getElementById('spin-btn');

    const items = OPTIONS.flatMap((cat, catIndex) => 
      cat.options.map(opt => ({ name: opt, category: cat.name, catIndex }))
    );
    const n = items.length;
    const slice = 360 / n;

    function buildWheelColors(n) {
      const stops = [];
      for (let i = 0; i < n; i++) {
        const start = i * slice;
        const end = (i + 1) * slice;
        const hue = Math.round((i / n) * 360);
        const c1 = `hsla(${hue}, 80%, 55%, 0.2)`;
        const c2 = `hsla(${(hue + 10) % 360}, 85%, 62%, 0.2)`;
        stops.push(`${c1} ${start}deg ${end}deg`);
      }
      return stops.join(',');
    }

    function renderWheel() {
      wheel.style.background = `conic-gradient(transparent 0deg, transparent 360deg)`; // Fallback
      wheel.style.background = `conic-gradient(${buildWheelColors(n)})`;
      
      labels.innerHTML = '';
      for (let i = 0; i < n; i++) {
        const mid = i * slice + slice / 2;
        const holder = document.createElement('div');
        holder.className = 'label';
        holder.style.transform = `rotate(${mid}deg) translate(50%)`;
        const chip = document.createElement('span');
        chip.textContent = items[i].name;
        holder.appendChild(chip);
        labels.appendChild(holder);
      }
    }

    function renderOptionsList() {
      const listEl = document.getElementById('options-list');
      listEl.innerHTML = '';
      OPTIONS.forEach(cat => {
        const catHeader = document.createElement('h3');
        catHeader.textContent = `${cat.name} (${cat.options.length})`;
        listEl.appendChild(catHeader);
        const ul = document.createElement('ul');
        cat.options.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item;
          ul.appendChild(li);
        });
        listEl.appendChild(ul);
      });
    }

    renderWheel();
    renderOptionsList();

    // ===================== 动画 =====================
    let currentRotation = 0;
    let spinning = false;

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function normalizeDeg(deg) { return ((deg % 360) + 360) % 360; }

    function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    async function spin() {
      if (spinning) return;
      spinning = true;
      btn.disabled = true;
      btn.textContent = '...';

      const idx = Math.floor(Math.random() * n);
      const theta = idx * slice + slice / 2;
      const baseDelta = normalizeDeg(270 - theta - normalizeDeg(currentRotation));
      const spins = randomInt(MIN_SPINS, MAX_SPINS);
      const delta = baseDelta + spins * 360;
      const duration = randomInt(MIN_DURATION, MAX_DURATION);

      const start = performance.now();
      const startRot = currentRotation;
      const endRot = currentRotation + delta;

      return new Promise((resolve) => {
        function frame(now) {
          const t = Math.min(1, (now - start) / duration);
          const eased = easeInOutCubic(t);
          const angle = startRot + (endRot - startRot) * eased;
          wheel.style.transform = `rotate(${angle}deg)`;
          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            currentRotation = endRot;
            btn.textContent = items[idx].name;
            spinning = false;
            btn.disabled = false;
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    btn.addEventListener('click', spin);
    </script>
</body>
</html>
